# TEMPORARY: CPU-measurement diagnostic for the worker deadline tests. Delete after use.
name: diag
on:
  push:
    branches: [fix/ledger-followups]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '22.23.4']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: nproc; uname -a; cat /proc/cpuinfo | grep 'model name' | head -1
      - run: node scripts/diag-cpu.mjs
