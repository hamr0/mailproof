# Push / PR gate: npm ci -> typecheck -> build:types -> check:lockfile -> test.
# Follows the suite CI template (CI_TEMPLATE.md, core job + JS-library variant).
# No lint step (tsc checkJs + strictNullChecks covers it). Tests are hermetic and
# token-free: each builds its own tmp git repos with the runner's `git`, so no
# system deps and no history (default fetch-depth). publish.yml re-runs this gate.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # tsc --noEmit (checkJs + strictNullChecks): a JSDoc/code mismatch blocks merge.
      - run: npm run typecheck

      # The shipped .d.ts are generated from the JSDoc and never committed
      # (git-ignored, built on publish via prepublishOnly). Build them here so a
      # declaration-emit error fails the PR, not the release.
      - run: npm run build:types

      # package-lock.json's own version must match package.json. `npm ci` only
      # checks the dependency entries, never this field, so a version bump made
      # without an install drifts silently. Also gated in publish.yml; run here
      # so the drift fails the PR instead of the release.
      - run: npm run check:lockfile

      # node --test over unit + integration; hermetic, token-free.
      # Expect "# skipped 2": the two real-`ots` tests in
      # tests/integration/ots.test.js skip when the OpenTimestamps client is not
      # on PATH. Deliberately not installed here (no PyPI download in the gate);
      # they run locally where `ots` is installed. Any other skip is a regression.
      - run: npm test
